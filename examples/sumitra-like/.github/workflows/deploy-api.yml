name: Deploy API
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      - run: docker build -t asia-south1-docker.pkg.dev/tl-sumitra-prod/sumitra/sumitra-api apps/api
      - run: docker push asia-south1-docker.pkg.dev/tl-sumitra-prod/sumitra/sumitra-api
      - run: gcloud run deploy sumitra-api --image asia-south1-docker.pkg.dev/tl-sumitra-prod/sumitra/sumitra-api --region asia-south1
