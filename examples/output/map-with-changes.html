<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sumitra (example) · RepoMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap" />
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --lane: #eef0f4; --lane-border: #e1e4ea; --card: #ffffff; --card-border: #d9dde5;
    --text: #0f172a; --muted: #5b6474; --faint: #8a93a3; --accent: #4f46e5; --accent-soft: rgba(79,70,229,.10);
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 2px 8px rgba(15,23,42,.05);
    --l-client: #64748b; --l-app: #4f46e5; --l-module: #7c3aed; --l-data: #0e7490; --l-cloud: #2563eb; --l-external: #a21caf; --l-cicd: #c2410c;
    --e-data: #0891b2; --e-integration: #a855f7; --e-deploy: #f59e0b; --e-structure: #9aa3b2; --e-security: #10b981; --e-call: #6366f1;
    --s-critical: #dc2626; --s-high: #ea580c; --s-medium: #ca8a04; --s-low: #94a3b8;
    --c-added: #16a34a; --c-removed: #dc2626; --c-changed: #d97706;
  }
  :root.dark {
    --bg: #0b0e14; --panel: #121722; --lane: #141a26; --lane-border: #1f2736; --card: #182030; --card-border: #2a3446;
    --text: #e6e9ef; --muted: #9aa4b5; --faint: #6b7588; --accent: #818cf8; --accent-soft: rgba(129,140,248,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.25);
    --l-client: #94a3b8; --l-app: #818cf8; --l-module: #a78bfa; --l-data: #22d3ee; --l-cloud: #60a5fa; --l-external: #e879f9; --l-cicd: #fb923c;
    --e-data: #22d3ee; --e-integration: #c084fc; --e-deploy: #fbbf24; --e-structure: #5b667a; --e-security: #34d399; --e-call: #818cf8;
    --s-low: #64748b;
  }
  /* v2 sketch palette (PRODUCT.md, "Visual style and colour palette"). --f-* fill, --k-* stroke. */
  :root {
    --paper: #FDFBF7; --paper2: #F4F1EA; --paper2-stroke: #D9D3C7; --ink: #1E1E1E; --pencil: #6B6B6B; --brand: #6965DB; --brand-stroke: #5B57D1;
    --f-client: #A5D8FF; --k-client: #1971C2; --f-app: #D0BFFF; --k-app: #6741D9; --f-module: #EEBEFA; --k-module: #9C36B5;
    --f-data: #B2F2BB; --k-data: #2F9E44; --f-cloud: #99E9F2; --k-cloud: #0C8599; --f-external: #FFEC99; --k-external: #F08C00;
    --f-cicd: #FFD8A8; --k-cicd: #E8590C; --f-risk: #FFC9C9; --k-risk: #E03131;
    --hand: Kalam, "Segoe Print", "Comic Sans MS", cursive; --title: Caveat, Kalam, "Segoe Print", cursive; --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root.dark { --paper: #1B1B1F; --paper2: #24242A; --paper2-stroke: #3A3A42; --ink: #E9E7E2; --pencil: #A3A09A; }
  body.sketch {
    --bg: var(--paper); --panel: var(--paper); --lane: var(--paper2); --lane-border: var(--paper2-stroke); --card: var(--paper); --card-border: var(--ink);
    --text: var(--ink); --muted: var(--pencil); --faint: var(--pencil); --accent: var(--brand); --accent-soft: rgba(105,101,219,.16); --shadow: none;
    --l-client: var(--k-client); --l-app: var(--k-app); --l-module: var(--k-module); --l-data: var(--k-data); --l-cloud: var(--k-cloud); --l-external: var(--k-external); --l-cicd: var(--k-cicd);
    --e-data: var(--k-data); --e-integration: var(--k-external); --e-deploy: var(--k-cicd); --e-structure: var(--pencil); --e-security: var(--k-cloud); --e-call: var(--brand);
    --s-critical: #E03131; --s-high: #E8590C; --s-medium: #F08C00; --s-low: var(--pencil);
    --c-added: #2F9E44; --c-removed: #E03131; --c-changed: #F08C00;
    font-family: var(--hand); font-size: 14px;
  }
  body.sketch #stage { background-color: var(--paper); background-image: radial-gradient(var(--paper2-stroke) 1.1px, transparent 1.3px); background-size: 22px 22px; }
  body.sketch header, body.sketch aside { border-color: var(--paper2-stroke); }
  body.sketch .brand h1 { font-family: var(--title); font-size: 26px; line-height: 1; }
  body.sketch .logo { background: var(--brand); border-radius: 9px 7px 10px 6px; font-family: var(--title); font-size: 20px; }
  body.sketch .tab { font-weight: 700; font-size: 14px; }
  body.sketch .btn { border: 1.5px solid var(--ink); border-radius: 10px 8px 11px 7px; font-weight: 700; font-size: 13.5px; }
  body.sketch .btn.primary { background: var(--brand); border-color: var(--brand-stroke); }
  body.sketch .card .label { font-family: var(--hand); font-size: 15px; font-weight: 700; }
  body.sketch .card .tech, body.sketch .card .cost { font-family: var(--hand); font-size: 12.5px; }
  body.sketch .lane-title { font-family: var(--title); font-size: 24px; font-weight: 700; letter-spacing: 0; fill: var(--ink); }
  body.sketch .lane-count { font-family: var(--title); font-size: 18px; }
  body.sketch .mono, body.sketch .ev, body.sketch .finding .f { font-family: var(--mono); }
  body.sketch aside h2 { font-family: var(--title); font-size: 30px; }
  body.sketch aside h3 { font-family: var(--title); font-size: 21px; text-transform: none; letter-spacing: 0; color: var(--ink); }
  body.sketch .stat, body.sketch .chip { border: 1px solid var(--paper2-stroke); }
  body.sketch #caption .title { font-family: var(--title); font-size: 30px; }
  .card .ring { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; opacity: 0; }
  body:not(.sketch) .card .ring { display: none; }
  body.sketch .card:hover .ring { opacity: .5; }
  body.sketch .card.sel .ring, body.sketch .card.match .ring { opacity: 1; }
  body.sketch .card rect.body { fill: var(--paper); stroke: none; }
  .edge .sk { opacity: .6; }
  .edge.hot .sk { opacity: 1; }

  /* Live mode (served by `repomind serve`). */
  .live-only { display: none !important; }
  body.live .live-only { display: inline-flex !important; }
  body.live #timeline.live-only { display: flex !important; }
  body.live #exportWrap { display: none; }
  body.live header { gap: 10px; flex-wrap: wrap; }
  body.live .search input { width: 150px; }
  body.live .brand .sub { display: none; }
  body.live .tabs { margin-left: 0; }
  .badge { align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 10px; border-radius: 99px; background: var(--lane); white-space: nowrap; }
  .badge .pulse { width: 8px; height: 8px; border-radius: 99px; background: var(--pencil); }
  .badge.on .pulse { background: #2F9E44; box-shadow: 0 0 0 0 rgba(47,158,68,.5); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(47,158,68,0); } 100% { box-shadow: 0 0 0 0 rgba(47,158,68,0); } }
  body.live #app { grid-template-rows: auto 1fr auto; }
  .seg { display: inline-flex; padding: 3px; background: var(--lane); border-radius: 10px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
  .seg button.on { background: var(--panel); color: var(--text); font-weight: 700; box-shadow: var(--shadow); }
  body.sketch .seg button.on { border: 2px solid var(--ink); }
  #timeline { flex-direction: column; gap: 4px; padding: 10px 20px 12px; background: var(--panel); border-top: 1px solid var(--lane-border); }
  body.sketch #timeline { border-top: 2.5px solid var(--ink); }
  .tl-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .tl-head .tl-title { font-family: var(--title); font-size: 26px; font-weight: 700; }
  .tl-head .tl-sub { font-size: 14px; color: var(--muted); }
  .tl-head .tl-clear { margin-left: auto; }
  .tl-track { position: relative; display: flex; align-items: flex-start; gap: 6px; padding: 6px 6px 2px; overflow-x: auto; scrollbar-width: thin; }
  .tl-track::before { content: ""; position: absolute; left: 6px; right: 6px; top: 22px; border-top: 2.5px dashed var(--paper2-stroke); }
  .tl-v { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 66px; min-height: 44px; border: 0; background: transparent; cursor: pointer; color: var(--text); font: inherit; padding: 0; }
  .tl-v .dot { width: 14px; height: 14px; margin-top: 9px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper2); }
  .tl-v.big .dot { width: 22px; height: 22px; margin-top: 5px; }
  .tl-v .sha { font-family: var(--mono); font-size: 11.5px; }
  .tl-v.big .sha { font-weight: 700; }
  .tl-v .when { font-size: 12px; color: var(--muted); }
  .tl-v.cur .dot { background: var(--brand); box-shadow: 0 0 0 5px #D0CFFB; }
  .tl-v.base .dot { box-shadow: 0 0 0 4px var(--pencil); }
  #toast { position: absolute; left: 50%; top: 18px; transform: translate(-50%, -12px) rotate(-0.6deg); display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); color: var(--text); border: 2.5px solid var(--ink); border-radius: 14px 10px 15px 11px; box-shadow: 4px 4px 0 #B2F2BB; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 20; max-width: 80%; }
  #toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) rotate(-0.6deg); }
  #toast .pulse { width: 10px; height: 10px; border-radius: 50%; background: #2F9E44; flex: none; }
  #toast a { color: var(--accent); font-weight: 700; cursor: pointer; }
  .deltas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .delta { padding: 10px; border: 2.5px solid; border-radius: 12px 9px 13px 10px; display: flex; flex-direction: column; }
  .delta b { font-size: 28px; line-height: 1; }
  .delta span { font-size: 13px; }
  .delta.add { border-color: #2F9E44; background: #EBFBEE; color: #1E1E1E; }
  .delta.rem { border-color: #E03131; background: #FFF5F5; color: #1E1E1E; }
  .delta.risk { border-color: #E8590C; background: #FFF4E6; color: #1E1E1E; }
  .range { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12.5px; margin-top: 8px; flex-wrap: wrap; }
  .range span { padding: 4px 10px; border: 2px solid var(--ink); border-radius: 9px 12px 8px 11px; background: var(--paper2); }
  .range span.to { background: #D0CFFB; color: #1E1E1E; font-weight: 700; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; place-items: center; z-index: 30; }
  #modal.open { display: grid; }
  #modal .box { position: relative; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 22px 15px 24px 17px; box-shadow: 8px 8px 0 var(--ink); padding: 26px 28px; width: min(980px, 94vw); max-height: 92vh; overflow-y: auto; font-family: var(--hand); }
  #modal .mhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #modal h1 { font-family: var(--title); font-size: 48px; margin: 0; line-height: 1; }
  #modal h2 { font-family: var(--title); font-size: 30px; margin: 4px 0 8px; }
  #modal .cols { display: flex; flex-wrap: wrap; gap: 26px; }
  #modal .col { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  #modal .live-box { padding: 18px; border: 2.5px dashed var(--brand); border-radius: 16px 12px 18px 13px; background: rgba(105,101,219,.06); }
  #modal .formats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  #modal .fmt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 80px; padding: 12px 14px; text-align: left; border: 2.5px solid var(--ink); border-radius: 14px 10px 15px 11px; background-color: var(--paper); font: inherit; color: var(--ink); cursor: pointer; }
  #modal .fmt b { font-size: 20px; }
  #modal .fmt span { font-size: 14px; color: var(--pencil); }
  #modal .field { display: flex; gap: 8px; align-items: center; }
  #modal .field input, #modal .field code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13px; padding: 10px 12px; border-radius: 9px 12px 8px 11px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); overflow-x: auto; white-space: nowrap; }
  #modal label.k { font-weight: 700; font-size: 14px; }
  #modal .hint { color: var(--pencil); font-size: 14px; }
  #modal .close { width: 44px; height: 44px; margin-left: auto; font-size: 22px; justify-content: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border: 2px solid #2F9E44; border-radius: 99px; background: #EBFBEE; color: #1E6B30; font-weight: 700; font-size: 14px; }
  .pill.off { border-color: var(--pencil); background: var(--paper2); color: var(--pencil); }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  button, input { font: inherit; color: inherit; }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--lane-border); position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #a855f7); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; flex: none; }
  .brand h1 { font-size: 14px; margin: 0; font-weight: 700; white-space: nowrap; }
  .brand .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: flex; gap: 2px; background: var(--lane); padding: 3px; border-radius: 10px; margin-left: 8px; }
  .tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .tab .count { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 99px; font-size: 11px; background: var(--s-high); color: #fff; }
  .tab .count.ok { background: var(--c-added); }
  .spacer { flex: 1; }
  .search { position: relative; }
  .search input { width: 220px; padding: 7px 10px 7px 30px; border-radius: 9px; border: 1px solid var(--card-border); background: var(--bg); outline: none; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 9px; top: 9px; opacity: .55; }
  .btn { border: 1px solid var(--card-border); background: var(--panel); padding: 6px 11px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .menu { position: relative; }
  .menu-list { position: absolute; right: 0; top: 36px; background: var(--panel); border: 1px solid var(--card-border); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; display: none; min-width: 170px; }
  .menu-list.open { display: block; }
  .menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
  .menu-list button:hover { background: var(--lane); }

  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #stage { position: relative; overflow: hidden; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #canvas { width: 100%; height: 100%; display: block; user-select: none; }
  aside { background: var(--panel); border-left: 1px solid var(--lane-border); overflow-y: auto; padding: 18px 18px 40px; }

  .lane-bg { fill: var(--lane); stroke: var(--lane-border); }
  .lane-title { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  .lane-count { fill: var(--faint); font-size: 11px; }
  .card rect.body { fill: var(--card); stroke: var(--card-border); }
  .card .label { fill: var(--text); font-size: 13px; font-weight: 650; }
  .card .tech { fill: var(--muted); font-size: 11.5px; }
  .card .icon-text { fill: #fff; font-size: 9.5px; font-weight: 800; letter-spacing: .02em; }
  .card .cost { fill: var(--faint); font-size: 11px; font-weight: 700; }
  .card .manual { fill: var(--faint); font-size: 10px; font-style: italic; }
  .card { cursor: pointer; transition: opacity .15s; }
  .card:hover rect.body { stroke: var(--accent); }
  .card.sel rect.body { stroke: var(--accent); stroke-width: 2; }
  .card.dim, .edge.dim { opacity: .14; }
  .card.match rect.body { stroke: var(--accent); stroke-width: 2.5; }
  .edge path.line { fill: none; stroke-width: 1.4; opacity: .55; }
  .edge.hot path.line { opacity: 1; stroke-width: 2; }
  .edge path.hit { fill: none; stroke: transparent; stroke-width: 10; cursor: help; }
  .edge.removed path.line { stroke-dasharray: 5 4; }
  .tag { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; }

  #tooltip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 7px; font-size: 12px; max-width: 360px; display: none; z-index: 10; box-shadow: var(--shadow); }
  .legend { position: absolute; left: 14px; bottom: 14px; background: var(--panel); border: 1px solid var(--lane-border); border-radius: 10px; padding: 8px 12px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); box-shadow: var(--shadow); max-width: calc(100% - 120px); }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 5px; vertical-align: middle; }
  .zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .zoom .btn { width: 34px; height: 34px; justify-content: center; padding: 0; font-size: 16px; }

  aside h2 { font-size: 18px; margin: 6px 0 2px; }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 20px 0 8px; }
  aside p { margin: 6px 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--lane); color: var(--muted); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--lane); border-radius: 10px; padding: 10px; }
  .stat b { display: block; font-size: 20px; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 11.5px; }
  .sevbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--lane); margin: 8px 0; }
  .finding { border: 1px solid var(--lane-border); border-left: 3px solid; border-radius: 8px; padding: 8px 10px; margin: 8px 0; cursor: pointer; }
  .finding:hover { background: var(--lane); }
  .finding .t { font-weight: 650; }
  .finding .f { color: var(--muted); font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .finding .fix { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .sev { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
  .rel { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .rel:hover { background: var(--lane); }
  .rel .k { color: var(--faint); font-size: 11px; width: 64px; flex: none; }
  .rel .n { font-weight: 600; }
  .rel .tt { color: var(--muted); font-size: 11.5px; margin-left: auto; text-align: right; }
  .ev { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); padding: 3px 0; word-break: break-all; }
  .ev a { color: var(--accent); text-decoration: none; }
  .ev em { font-style: normal; color: var(--faint); }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 3px 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .muted { color: var(--muted); }
  .back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; }
  .status { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 99px; color: #fff; }

  body.presenting header, body.presenting aside, body.presenting .legend, body.presenting .zoom { display: none; }
  body.presenting main { grid-template-columns: 1fr; }
  body.presenting #app { grid-template-rows: 1fr; }
  #caption { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--lane-border); box-shadow: var(--shadow); border-radius: 14px; padding: 14px 20px; max-width: min(820px, 90%); display: none; }
  body.presenting #caption { display: block; }
  #caption .step { color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  #caption .title { font-size: 20px; font-weight: 750; margin: 2px 0 4px; }
  #caption .body { color: var(--muted); font-size: 14px; }
  #caption .nav { color: var(--faint); font-size: 11.5px; margin-top: 8px; }
  #svg-wrap { transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  #stage.no-anim #svg-wrap { transition: none; }

  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } aside { display: none; } .search input { width: 150px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">R</div>
      <div style="min-width:0">
        <h1 id="repoName">RepoMind</h1>
        <div class="sub" id="repoSub"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="spacer"></div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search components…  ( / )" autocomplete="off" />
    </label>
    <span class="badge live-only" id="liveBadge" title="Live updates"><span class="pulse"></span><span id="liveText">Snapshot</span></span>
    <button class="btn live-only" id="refreshBtn" title="Check GitHub for a new commit now">↻</button>
    <div class="seg" id="styleSeg" role="group" aria-label="Drawing style (S)"><button data-s="sketch">Sketch</button><button data-s="clean">Clean</button></div>
    <button class="btn primary" id="presentBtn" title="Presentation mode (P)">▶ Present</button>
    <button class="btn live-only" id="downloadBtn">Download</button>
    <div class="menu" id="exportWrap">
      <button class="btn" id="exportBtn">Export ▾</button>
      <div class="menu-list" id="exportMenu">
        <button data-x="png">PNG image (2×)</button>
        <button data-x="svg">SVG vector</button>
        <button data-x="json">Graph JSON</button>
      </div>
    </div>
    <button class="btn" id="themeBtn" title="Toggle theme (T)">Theme</button>
  </header>
  <main>
    <div id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs"></defs>
        <g id="svg-wrap"><g id="lanes"></g><g id="edges"></g><g id="cards"></g></g>
      </svg>
      <div id="tooltip"></div>
      <div class="legend" id="legend"></div>
      <div class="zoom">
        <button class="btn" id="zin" title="Zoom in">+</button>
        <button class="btn" id="zout" title="Zoom out">−</button>
        <button class="btn" id="zfit" title="Fit (F)">⤢</button>
      </div>
      <div id="caption"></div>
      <div id="toast" role="status"></div>
    </div>
    <aside id="panel"></aside>
  </main>
  <footer id="timeline" class="live-only" aria-label="Version timeline"></footer>
</div>

    const f = el('filter', { id: 'shadow', x: '-10%', y: '-10%', width: '120%', height: '140%' }, defs);
    el('feDropShadow', { dx: '0', dy: '1', stdDeviation: '1.5', 'flood-color': '#0f172a', 'flood-opacity': '0.08' }, f);
  }

  // ---------- Sketch (rough.js) ----------
  const sketchOn = () => document.body.classList.contains('sketch') && typeof rough !== 'undefined';
  // Stable seed per id, so the same commit always gives the same wobble (PRD v2, R2).
  const seedOf = (s) => {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return (h >>> 0) % 2147483646 + 1;
  };
  let rc = null;
  const SEVERE = new Set(['critical', 'high']);
  function sketchFill(n) {
    const ch = changeOf(n.id);
    if (state.view === 'changes' && ch) return { added: '--f-data', changed: '--f-external', removed: '--f-risk' }[ch];
    if (state.view === 'risks' && (findingsByNode.get(n.id) || []).some((f) => SEVERE.has(f.severity))) return '--f-risk';
    return `--f-${n.layer}`;
  }

  function render() {
    const L = layout(state.view);
    state.L = L;
    const lanesG = $('#lanes'), edgesG = $('#edges'), cardsG = $('#cards');
    lanesG.innerHTML = edgesG.innerHTML = cardsG.innerHTML = '';

    const sk = sketchOn();
    rc = sk ? rough.svg($('#canvas')) : null;
    const ink = cssVar('--ink'), pencil = cssVar('--pencil');

    L.lanes.forEach((k, i) => {
      const x = i * (LANE_W + LANE_GAP);
      if (sk) {
        lanesG.appendChild(rc.rectangle(x, 0, LANE_W, L.laneH, { seed: seedOf('lane:' + k), stroke: pencil, strokeWidth: 1.3, roughness: 1.4, strokeLineDash: [8, 7] }));
        el('text', { x: x + LANE_PAD, y: 32, class: 'lane-title' }, lanesG).textContent = LAYER_NAME[k];
        el('text', { x: x + LANE_W - LANE_PAD, y: 32, class: 'lane-count', 'text-anchor': 'end' }, lanesG).textContent = L.cols[i].length;
        return;
      }
      el('rect', { x, y: 0, width: LANE_W, height: L.laneH, rx: 16, class: 'lane-bg' }, lanesG);
      el('rect', { x: x + LANE_PAD, y: 17, width: 4, height: 14, rx: 2, fill: `var(--l-${k})` }, lanesG);
      el('text', { x: x + LANE_PAD + 12, y: 28.5, class: 'lane-title' }, lanesG).textContent = LAYER_NAME[k].toUpperCase();
      el('text', { x: x + LANE_W - LANE_PAD, y: 28.5, class: 'lane-count', 'text-anchor': 'end' }, lanesG).textContent = L.cols[i].length;
    });

    // Ports: spread edge ends along each card side, ordered by where the other end sits.
    const sides = [];
    const portLists = new Map();
    for (const e of L.edges) {
      const a = L.place.get(e.from), b = L.place.get(e.to);
      const sa = a.col <= b.col ? 'r' : 'l';
      const sb = a.col < b.col ? 'l' : 'r';
      const item = { e, sa, sb };
      sides.push(item);
      for (const [id, side, other, role] of [[e.from, sa, b, 'a'], [e.to, sb, a, 'b']]) {
        const k = `${id}|${side}`;
        if (!portLists.has(k)) portLists.set(k, []);
        portLists.get(k).push({ item, role, oy: other.y });
      }
    }
    for (const [k, list] of portLists) {
      const id = k.split('|')[0];
      const p = L.place.get(id);
      list.sort((u, w) => u.oy - w.oy);
      const n = list.length;
      const span = Math.min(CARD_H - 18, (n - 1) * 8);
      list.forEach((entry, i) => {
        entry.item[entry.role === 'a' ? 'y1' : 'y2'] = p.y + CARD_H / 2 - span / 2 + (n === 1 ? 0 : (i * span) / (n - 1));
      });
    }

    for (const it of sides) {
      const { e, sa, sb, y1, y2 } = it;
      const a = L.place.get(e.from), b = L.place.get(e.to);
      const x1 = sa === 'r' ? a.x + CARD_W : a.x;
      const x2 = sb === 'r' ? b.x + CARD_W : b.x;
      let d;
      if (sa === 'r' && sb === 'r') {
        const bulge = 30 + Math.min(44, Math.abs(y2 - y1) / 5);
        d = `M${x1} ${y1} C${x1 + bulge} ${y1}, ${x2 + bulge} ${y2}, ${x2 + 2} ${y2}`;
      } else {
        const dx = Math.max(40, Math.abs(x2 - x1) * 0.45);
        const s = sa === 'r' ? 1 : -1;
        d = `M${x1} ${y1} C${x1 + s * dx} ${y1}, ${x2 - s * dx} ${y2}, ${x2 - s * 2} ${y2}`;
      }
      const grp = EDGE_GROUP[e.kind] || 'call';
      const isAdded = DIFF && addedEdges.has(ekey(e)) && state.view === 'changes';
      const tone = e._removed ? 'removed' : isAdded ? 'added' : grp;
      const gEl = el('g', { class: `edge${e._removed ? ' removed' : ''}`, 'data-from': e.from, 'data-to': e.to }, edgesG);
      const stroke = tone === 'added' ? 'var(--c-added)' : tone === 'removed' ? 'var(--c-removed)' : `var(--e-${grp})`;
      if (sk) {
        const color = cssVar(stroke.slice(4, -1));
        const r = rc.path(d, { seed: seedOf(ekey(e)), stroke: color, strokeWidth: 1.6, roughness: 0.9, bowing: 1.2, strokeLineDash: e._removed ? [6, 5] : undefined });
        r.setAttribute('class', 'sk');
        const paths = r.querySelectorAll('path');
        if (paths.length) paths[paths.length - 1].setAttribute('marker-end', `url(#arr-${tone})`);
        gEl.appendChild(r);
      } else el('path', { d, class: 'line', stroke, 'marker-end': `url(#arr-${tone})` }, gEl);
      const hit = el('path', { d, class: 'hit' }, gEl);
      hit.addEventListener('mousemove', (ev) => showTip(ev, edgeTip(e)));
      hit.addEventListener('mouseleave', hideTip);
    }

    for (const n of L.nodes) {
      const p = L.place.get(n.id);
      const g = el('g', { class: 'card', transform: `translate(${p.x},${p.y})`, 'data-id': n.id }, cardsG);
      const ch = changeOf(n.id);
      if (sk) {
        // Opaque paper underneath so the hatching never shows lines through it; ring is the selection outline.
        el('rect', { class: 'body', width: CARD_W, height: CARD_H, rx: 6 }, g);
        const seed = seedOf(n.id);
        // Chalkboard mode: same fills at lower strength (PRD v2 style rules).
        const fill = cssVar(sketchFill(n)) + (document.documentElement.classList.contains('dark') ? '59' : '');
        g.appendChild(rc.rectangle(1, 1, CARD_W - 2, CARD_H - 2, { seed, fill, fillStyle: 'hachure', hachureGap: 6, fillWeight: 1.1, hachureAngle: -41, stroke: ink, strokeWidth: 1.8, roughness: 1.1, strokeLineDash: ch === 'removed' ? [7, 5] : undefined }));
        el('rect', { class: 'ring', x: -5, y: -5, width: CARD_W + 10, height: CARD_H + 10, rx: 10 }, g);
        g.appendChild(rc.circle(27, 31, 32, { seed: seed + 1, fill: cssVar(`--k-${n.layer}`), fillStyle: 'solid', stroke: ink, strokeWidth: 1.4, roughness: 0.9 }));
      } else {
        el('rect', { class: 'body', width: CARD_W, height: CARD_H, rx: 10, filter: 'url(#shadow)', 'stroke-dasharray': ch === 'removed' ? '5 4' : null }, g);
        if (ch) el('rect', { x: 0, y: 10, width: 4, height: CARD_H - 20, rx: 2, fill: `var(--c-${ch})` }, g);
        el('rect', { x: 12, y: 16, width: 30, height: 30, rx: 8, fill: `var(--l-${n.layer})` }, g);
      }
      el('text', { x: 27, y: 34.5, class: 'icon-text', 'text-anchor': 'middle' }, g).textContent = TECH_ICON[n.tech] || ICON[n.kind] || 'NOD';
      el('text', { x: 52, y: 28, class: 'label' }, g).textContent = truncate(n.label, 21);
      const parent = n.parent ? allNodes.get(n.parent)?.label : null;
      el('text', { x: 52, y: 45, class: 'tech' }, g).textContent = truncate(parent ? `${parent} · ${n.tech || ''}` : n.tech || LAYER_NAME[n.layer], n.cost && n.cost.tier !== 'free' ? 21 : 26);
      if (n.cost && n.cost.tier !== 'free') el('text', { x: CARD_W - 10, y: 45, class: 'cost', 'text-anchor': 'end' }, g).textContent = TIER[n.cost.tier];
      const sev = worstSev(n.id);
      if (sev) {
        el('circle', { cx: CARD_W - 4, cy: 4, r: 10, fill: `var(--s-${sev})`, stroke: 'var(--bg)', 'stroke-width': 2 }, g);
        el('text', { x: CARD_W - 4, y: 8, 'text-anchor': 'middle', fill: '#fff', 'font-size': '10.5', 'font-weight': '800' }, g).textContent = findingsByNode.get(n.id).length;
      }
      if (ch) {
        const w = ch === 'added' ? 38 : 64;
        el('rect', { x: CARD_W - w - 20, y: -8, width: w, height: 16, rx: 8, fill: `var(--c-${ch})` }, g);
        el('text', { x: CARD_W - w / 2 - 20, y: 3.5, 'text-anchor': 'middle', fill: '#fff', class: 'tag' }, g).textContent = ch === 'added' ? 'NEW' : ch.toUpperCase();
      }
      if (n.manual) el('text', { x: CARD_W - 10, y: 26, class: 'manual', 'text-anchor': 'end' }, g).textContent = 'manual';
      g.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (!document.body.classList.contains('presenting')) select(n.id);
      });
      g.addEventListener('mouseenter', () => hover(n.id));
      g.addEventListener('mouseleave', () => hover(null));
    }
    applyHighlight();
    renderLegend();
  }

  function edgeTip(e) {
    const a = allNodes.get(e.from), b = allNodes.get(e.to);
    const ev = e.evidence?.[0];
    return `<b>${esc(a?.label)}</b> → <b>${esc(b?.label)}</b> · ${esc(e.label || e.kind)}${e._removed ? ' <i>(removed)</i>' : ''}${ev ? `<br><span style="opacity:.75">${esc(ev.file)}${ev.line ? ':' + ev.line : ''}${ev.note ? ' · ' + esc(ev.note) : ''}</span>` : ''}`;
  }
  function showTip(ev, html) {
    const t = $('#tooltip');
    t.innerHTML = html;
    t.style.display = 'block';
    const r = $('#stage').getBoundingClientRect();
    t.style.left = Math.max(8, Math.min(ev.clientX - r.left + 14, r.width - 370)) + 'px';
    t.style.top = ev.clientY - r.top + 14 + 'px';
  }
  function hideTip() {
    $('#tooltip').style.display = 'none';
  }

  let hoverId = null;
  function hover(id) {
    if (document.body.classList.contains('presenting')) return;
    hoverId = id;
    applyHighlight();
  }
  const matches = (n, q) => !!n && [n.label, n.tech, n.id, n.category, n.description].some((s) => String(s ?? '').toLowerCase().includes(q));

  function applyHighlight() {
    const focusId = hoverId || state.selected;
    const v = VIEWS[state.view];
    const q = state.query.toLowerCase();
    let near = null;
    if (focusId && state.L.place.has(focusId)) {
      near = new Set([focusId]);
      for (const e of state.L.edges) {
        if (e.from === focusId) near.add(e.to);
        if (e.to === focusId) near.add(e.from);
      }
    }
    document.querySelectorAll('.card').forEach((c) => {
      const id = c.dataset.id;
      const n = allNodes.get(id);
      let dim = false;
      if (near) dim = !near.has(id);
      else if (q) dim = !matches(n, q);
      else if (v.focus) dim = !v.focus(id);
      c.classList.toggle('dim', dim);
      c.classList.toggle('sel', id === state.selected);
      c.classList.toggle('match', !!q && matches(n, q));
    });
    document.querySelectorAll('.edge').forEach((g) => {
      const f = g.dataset.from, t = g.dataset.to;
      let hot = false, dim = false;
      if (near) {
        hot = f === focusId || t === focusId;
        dim = !hot;
      } else if (q) dim = true;
      else if (v.focus) dim = !(v.focus(f) && v.focus(t)) && !g.classList.contains('removed');
      g.classList.toggle('hot', hot);
      g.classList.toggle('dim', dim);
    });
  }

  function renderLegend() {
    const groups = new Set(state.L.edges.map((e) => EDGE_GROUP[e.kind] || 'call'));
    let h = [...groups].map((g) => `<span><i style="border-color:var(--e-${g})"></i>${EDGE_GROUP_NAME[g]}</span>`).join('');
    if (G.findings.length) h += SEV.map((s) => `<span><span class="dot" style="background:var(--s-${s})"></span>${s}</span>`).join('');
    if (state.view === 'changes') h += ['added', 'changed', 'removed'].map((s) => `<span><span class="dot" style="background:var(--c-${s})"></span>${s}</span>`).join('');
    h += `<span>$ · $$ · $$$ cost tier</span>`;
    $('#legend').innerHTML = h;
  }


  // ---------- Panel ----------
  const evLink = (ev) => {
    const label = `${esc(ev.file)}${ev.line ? ':' + ev.line : ''}`;
    const href = BLOB && ev.file && !ev.file.startsWith('.repomind') ? `${BLOB}/${ev.file}${ev.line ? '#L' + ev.line : ''}` : null;
    return `<div class="ev">${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>` : label}${ev.note ? ` <em>· ${esc(ev.note)}</em>` : ''}</div>`;
  };
  const findingHtml = (f) =>
    `<div class="finding" style="border-left-color:var(--s-${f.severity})" data-node="${esc(f.node || '')}"><div class="t"><span class="sev" style="color:var(--s-${f.severity})">${f.severity}</span>${esc(f.title)}${newFindings.has(f.id) ? ' <span class="status" style="background:var(--c-added)">NEW</span>' : ''}</div><div class="f">${esc(f.file || '')}${f.line ? ':' + f.line : ''}</div>${f.fix ? `<div class="fix">↳ ${esc(f.fix)}</div>` : ''}</div>`;
  const statusPill = (c) => `<span class="status" style="background:var(--c-${c})">${c === 'added' ? 'NEW' : c.toUpperCase()}</span>`;

  function panelSummary() {
    const P = $('#panel');
    const count = (l) => G.nodes.filter((n) => n.layer === l).length;
    const sevCount = Object.fromEntries(SEV.map((s) => [s, G.findings.filter((f) => f.severity === s).length]));
    const total = G.findings.length || 1;
    const rank = { high: 0, medium: 1, low: 2 };
    const paid = G.nodes
      .filter((n) => n.cost && n.cost.tier !== 'free' && ['external', 'cloud', 'data'].includes(n.layer))
      .sort((a, b) => rank[a.cost.tier] - rank[b.cost.tier] || a.label.localeCompare(b.label));
    const v = VIEWS[state.view];
    let h = `<div class="chips"><span class="chip">${esc(v.name)} view</span></div><p>${esc(v.blurb)}</p>`;

    if (state.view === 'changes' && DIFF) {
      const comps0 = (ids) => ids.map((id) => allNodes.get(id)).filter((n) => n && n.kind !== 'module');
      const nNew = G.findings.filter((f) => newFindings.has(f.id)).length;
      if (DIFF.baseCommit) h += `<div class="range"><span>${esc(DIFF.baseCommit)}</span>→<span class="to">${esc(DIFF.headCommit || 'now')}</span></div>`;
      h += `<div class="deltas"><div class="delta add"><b>+${comps0(DIFF.added).length}</b><span>added</span></div><div class="delta rem"><b>−${comps0(DIFF.removed).length}</b><span>removed</span></div><div class="delta risk"><b>${nNew}</b><span>new risks</span></div></div>`;
      const list = (ids, c) =>
        ids.map((id) => allNodes.get(id)).filter((n) => n && n.kind !== 'module')
          .map((n) => `<div class="rel" data-go="${esc(n.id)}">${statusPill(c)}<span class="n">${esc(n.label)}</span><span class="tt">${esc(n.tech || '')}</span></div>`).join('');
      const comps = list(DIFF.added, 'added') + list(DIFF.changed.map((c) => c.id), 'changed') + list(DIFF.removed, 'removed');
      h += `<h3>Components</h3>${comps || '<p>No component changes.</p>'}`;
      const nf = G.findings.filter((f) => newFindings.has(f.id));
      h += `<h3>New risks · ${nf.length}</h3>${nf.map(findingHtml).join('') || '<p>None.</p>'}`;
      if (DIFF.resolvedFindings.length) h += `<h3>Fixed risks</h3><ul class="plain">${DIFF.resolvedFindings.map((f) => `<li><s>${esc(f.title)}</s> <span class="mono muted">${esc(f.file || '')}</span></li>`).join('')}</ul>`;
      const paidOf = (ids) => comps0(ids).filter((n) => n.cost && n.cost.tier !== 'free');
      const cost = [...paidOf(DIFF.added).map((n) => `↑ ${esc(n.label)} · ${TIER[n.cost.tier]} ${esc(n.cost.model)}`), ...paidOf(DIFF.removed).map((n) => `↓ ${esc(n.label)} · ${TIER[n.cost.tier]} ${esc(n.cost.model)}`)];
      if (cost.length) h += `<h3>Cost</h3><p>${cost.join('<br>')}</p>`;
      P.innerHTML = h;
      return wirePanel();
    }

    h += `<h3>At a glance</h3><div class="stats">
      <div class="stat"><b>${count('app')}</b><span>apps & services</span></div>
      <div class="stat"><b>${count('module')}</b><span>modules</span></div>
      <div class="stat"><b>${count('data')}</b><span>data stores</span></div>
      <div class="stat"><b>${count('cloud')}</b><span>cloud resources</span></div>
      <div class="stat"><b>${count('external')}</b><span>external services</span></div>
      <div class="stat"><b>${count('cicd')}</b><span>pipelines</span></div></div>`;
    h += `<h3>Open risks · ${G.findings.length}</h3><div class="sevbar">${SEV.map((s) => `<div style="width:${(sevCount[s] / total) * 100}%;background:var(--s-${s})"></div>`).join('')}</div>
      <div class="chips">${SEV.map((s) => `<span class="chip">${sevCount[s]} ${s}</span>`).join('')}</div>`;
    const shown = state.view === 'risks' ? G.findings : G.findings.slice(0, 3);
    h += shown.map(findingHtml).join('');
    if (state.view !== 'risks' && G.findings.length > 3) h += `<button class="back" data-view="risks">See all ${G.findings.length} risks →</button>`;
    if (state.view !== 'risks') {
      h += `<h3>Paid services · ${paid.length}</h3>${paid.map((n) => `<div class="rel" data-go="${esc(n.id)}"><span class="k">${TIER[n.cost.tier]}</span><span class="n">${esc(n.label)}</span><span class="tt">${esc(n.cost.model)}</span></div>`).join('') || '<p>None detected.</p>'}`;
    }
    h += `<h3>Scan</h3><p class="mono">${esc(G.meta.repo)}${G.meta.commit ? ' @ ' + esc(G.meta.commit) : ''}<br>${G.meta.stats.files} files · ${G.meta.stats.ms} ms<br>${esc(new Date(G.meta.scannedAt).toLocaleString())}</p>`;
    h += `<h3>Shortcuts</h3><p class="mono">/ search · 1–6 views · F fit · P present · T theme</p>`;
    P.innerHTML = h;
    wirePanel();
  }

  function panelNode(id) {
    const n = allNodes.get(id);
    if (!n) return panelSummary();
    const P = $('#panel');
    const ch = changeOf(id);
    let h = `<button class="back" id="backBtn">← ${esc(VIEWS[state.view].name)}</button>
      <h2>${esc(n.label)}</h2>
      <div class="chips"><span class="chip" style="color:var(--l-${n.layer})">${esc(LAYER_NAME[n.layer] || n.layer)}</span>${n.tech ? `<span class="chip">${esc(n.tech)}</span>` : ''}${n.cost ? `<span class="chip">${TIER[n.cost.tier]} · ${esc(n.cost.model)}</span>` : ''}${n.manual ? '<span class="chip">added by hand</span>' : ''}${ch ? statusPill(ch) : ''}</div>`;
    if (n.description) h += `<p>${esc(n.description)}</p>`;
    if (ch === 'changed') h += `<p><b>Changed:</b> ${esc(DIFF.changed.find((x) => x.id === id).fields.join(', '))}</p>`;
    const fs = findingsByNode.get(id) || [];
    if (fs.length) h += `<h3>Risks · ${fs.length}</h3>${fs.map(findingHtml).join('')}`;
    const out = allEdges.filter((e) => e.from === id && e.kind !== 'contains');
    const inc = allEdges.filter((e) => e.to === id && e.kind !== 'contains');
    const kids = allEdges.filter((e) => e.from === id && e.kind === 'contains');
    const rel = (e, other) => {
      const o = allNodes.get(other);
      return o ? `<div class="rel" data-go="${esc(o.id)}"><span class="k">${esc(e.label || e.kind)}</span><span class="n">${esc(o.label)}</span><span class="tt">${esc(o.tech || '')}</span></div>` : '';
    };
    if (out.length) h += `<h3>Uses · ${out.length}</h3>${out.map((e) => rel(e, e.to)).join('')}`;
    if (inc.length) h += `<h3>Used by · ${inc.length}</h3>${inc.map((e) => rel(e, e.from)).join('')}`;
    if (kids.length) h += `<h3>Modules · ${kids.length}</h3>${kids.map((e) => rel(e, e.to)).join('')}`;
    const m = n.meta || {};
    if (m.routes?.length) h += `<h3>API routes · ${m.routeCount}</h3><ul class="plain mono">${m.routes.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`;
    else if (m.routeCount) h += `<h3>API routes</h3><p>${m.routeCount} routes across its modules.</p>`;
    if (m.models?.length) h += `<h3>Data models · ${m.models.length}</h3><div class="chips">${m.models.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>`;
    if (m.container) h += `<h3>Container</h3><p class="mono">base ${esc(m.container.base || '?')}<br>ports ${esc((m.container.ports || []).join(', ') || '–')}<br>user ${esc(m.container.user)}</p>`;
    if (m.triggers?.length) h += `<h3>Triggered by</h3><div class="chips">${m.triggers.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
    if (n.evidence?.length) h += `<h3>Evidence</h3>${n.evidence.map(evLink).join('')}`;
    h += `<h3>Id</h3><p class="mono">${esc(n.id)}</p>`;
    P.innerHTML = h;
    $('#backBtn').onclick = () => select(null);
    wirePanel();
  }

  function wirePanel() {
    document.querySelectorAll('#panel [data-go]').forEach((x) => (x.onclick = () => goTo(x.dataset.go)));
    document.querySelectorAll('#panel .finding').forEach((x) => (x.onclick = () => x.dataset.node && goTo(x.dataset.node)));
    document.querySelectorAll('#panel [data-view]').forEach((x) => (x.onclick = () => setView(x.dataset.view)));
  }

  function select(id) {
    state.selected = id;
    applyHighlight();
    id ? panelNode(id) : panelSummary();
  }

  function goTo(id) {
    if (!state.L.place.has(id)) {
      const n = allNodes.get(id);
      setView(n?.kind === 'module' ? 'code' : 'overview');
    }
    select(id);
    const p = state.L.place.get(id);
    if (p) zoomTo({ x: p.x - 200, y: p.y - 160, w: CARD_W + 400, h: CARD_H + 320 }, 1);
  }

  // ---------- Pan / zoom ----------
  const view = { x: 0, y: 0, k: 1 };
  const wrap = $('#svg-wrap');
  const stage = $('#stage');
  function applyView(anim) {
    stage.classList.toggle('no-anim', !anim);
    wrap.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  }
  const contentBox = () => ({ x: -20, y: -20, w: state.L.width + 40, h: state.L.laneH + 40 });
  function zoomTo(box, minK) {
    const r = stage.getBoundingClientRect();
    const padB = document.body.classList.contains('presenting') ? 170 : 70;
    let k = Math.min(r.width / box.w, (r.height - padB) / box.h);
    if (minK) k = Math.max(k, Math.min(minK, 1.4));
    k = Math.max(0.12, Math.min(k, 1.4));
    view.k = k;
    view.x = r.width / 2 - (box.x + box.w / 2) * k;
    view.y = (r.height - padB) / 2 + 8 - (box.y + box.h / 2) * k;
    applyView(true);
  }
  const fit = () => zoomTo(contentBox());
  stage.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const r = stage.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    if (!ev.ctrlKey && Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) {
      view.x -= ev.deltaX;
      return applyView(false);
    }
    const f = Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0018));
    const k = Math.max(0.12, Math.min(3, view.k * f));
    view.x = mx - ((mx - view.x) * k) / view.k;
    view.y = my - ((my - view.y) * k) / view.k;
    view.k = k;
    applyView(false);
  }, { passive: false });
  let drag = null;
  stage.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.card, .legend, .zoom, #caption') || ev.button !== 0) return;
    drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false };
    stage.classList.add('dragging');
  });
  window.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx + dx;
    view.y = drag.vy + dy;
    applyView(false);
  });
  window.addEventListener('pointerup', () => {
    if (drag && !drag.moved) {
      if (document.body.classList.contains('presenting')) showStep(stepIdx + 1);
      else select(null);
    }
    drag = null;
    stage.classList.remove('dragging');
  });
  function zoomBy(f) {
    const r = stage.getBoundingClientRect();
    const mx = r.width / 2, my = r.height / 2;
    const k = Math.max(0.12, Math.min(3, view.k * f));
    view.x = mx - ((mx - view.x) * k) / view.k;
    view.y = my - ((my - view.y) * k) / view.k;
    view.k = k;
    applyView(true);
  }
  $('#zin').onclick = () => zoomBy(1.25);
  $('#zout').onclick = () => zoomBy(0.8);
  $('#zfit').onclick = fit;

  // ---------- Tabs / search ----------
  function renderTabs() {
    const tabs = $('#tabs');
    tabs.innerHTML = '';
    Object.entries(VIEWS).forEach(([k, v], i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (state.view === k ? ' on' : '');
      b.title = `${v.blurb} (${i + 1})`;
      b.textContent = v.name;
      if (k === 'risks' && G.findings.length) b.innerHTML += `<span class="count">${G.findings.length}</span>`;
      if (k === 'changes' && DIFF) b.innerHTML += `<span class="count ok">${DIFF.added.length + DIFF.removed.length + DIFF.changed.length}</span>`;
      b.onclick = () => setView(k);
      tabs.appendChild(b);
    });
  }
  function setView(k) {
    state.view = k;
    state.selected = null;
    hoverId = null;
    renderTabs();
    render();
    panelSummary();
    requestAnimationFrame(fit);
    try { history.replaceState(null, '', '#' + k); } catch (e) {}
  }
  $('#q').addEventListener('input', (ev) => {
    state.query = ev.target.value.trim();
    applyHighlight();
  });
  $('#q').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') {
      const q = state.query.toLowerCase();
      const hit = [...state.L.nodes, ...allNodes.values()].find((n) => matches(n, q));
      if (hit) goTo(hit.id);
    }
    if (ev.key === 'Escape') {
      ev.target.value = '';
      state.query = '';
      applyHighlight();
      ev.target.blur();
    }
  });

  // ---------- Theme ----------
  const setTheme = (dark) => {
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('repomind-theme', dark ? 'dark' : 'light'); } catch (e) {}
  };
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('repomind-theme'); } catch (e) {}
  setTheme(savedTheme ? savedTheme === 'dark' : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
  $('#themeBtn').onclick = () => setTheme(!document.documentElement.classList.contains('dark'));

  // ---------- Export ----------
  $('#exportBtn').onclick = (ev) => {
    ev.stopPropagation();
    $('#exportMenu').classList.toggle('open');
  };
  document.addEventListener('click', () => $('#exportMenu').classList.remove('open'));
  $('#exportMenu').addEventListener('click', (ev) => {
    const x = ev.target.dataset.x;
    if (x === 'svg') download(new Blob([exportSvg()], { type: 'image/svg+xml' }), `${fileBase()}.svg`);
    if (x === 'json') download(new Blob([JSON.stringify(G, null, 2)], { type: 'application/json' }), `${fileBase()}.graph.json`);
    if (x === 'png') exportPng();
  });
  function exportAs(x) {
    if (x === 'svg') download(new Blob([exportSvg()], { type: 'image/svg+xml' }), `${fileBase()}.svg`);
    if (x === 'json') download(new Blob([JSON.stringify(G, null, 2)], { type: 'application/json' }), `${fileBase()}.graph.json`);
    if (x === 'png') exportPng();
  }
  const fileBase = () => `${String(G.meta.repo).replace(/[^\w-]+/g, '-')}-${state.view}`;
  function exportSvg() {
    const src = $('#canvas');
    const clone = src.cloneNode(true);
    const props = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'font-size', 'font-weight', 'font-family', 'font-style', 'letter-spacing', 'fill-opacity', 'stroke-opacity'];
    const a = src.querySelectorAll('*'), b = clone.querySelectorAll('*');
    a.forEach((node, i) => {
      const cs = getComputedStyle(node);
      for (const p of props) {
        const val = cs.getPropertyValue(p);
        if (val) b[i].setAttribute(p, val);
      }
      b[i].removeAttribute('class');
    });
    clone.querySelectorAll('path').forEach((p) => p.getAttribute('stroke') === 'rgba(0, 0, 0, 0)' && p.remove());
    const w = clone.querySelector('#svg-wrap');
    w.removeAttribute('style');
    const box = contentBox();
    const titleH = 64;
    clone.setAttribute('viewBox', `${box.x} ${box.y - titleH} ${box.w} ${box.h + titleH}`);
    clone.setAttribute('width', box.w);
    clone.setAttribute('height', box.h + titleH);
    const bg = document.createElementNS(NS, 'rect');
    Object.entries({ x: box.x, y: box.y - titleH, width: box.w, height: box.h + titleH, fill: cssVar('--bg') }).forEach(([k, v]) => bg.setAttribute(k, v));
    clone.insertBefore(bg, clone.firstChild);
    const t = document.createElementNS(NS, 'text');
    Object.entries({ x: box.x + 24, y: box.y - titleH + 40, fill: cssVar('--text'), 'font-size': 22, 'font-weight': 700, 'font-family': 'system-ui, -apple-system, Segoe UI, sans-serif' }).forEach(([k, v]) => t.setAttribute(k, v));
    t.textContent = `${G.meta.repo} — ${VIEWS[state.view].name}`;
    clone.insertBefore(t, bg.nextSibling);
    return new XMLSerializer().serializeToString(clone);
  }
  function exportPng() {
    const svg = exportSvg();
    const box = contentBox();
    const img = new Image();
    const scale = 2;
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = box.w * scale;
      c.height = (box.h + 64) * scale;
      const ctx = c.getContext('2d');
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);
      c.toBlob((blob) => download(blob, `${fileBase()}.png`));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ---------- Presentation ----------
  let steps = [], stepIdx = 0;
  function buildSteps() {
    const s = [];
    const L = layout('overview');
    const n = (l) => G.nodes.filter((x) => x.layer === l);
    const names = (arr, max = 6) => arr.slice(0, max).map((x) => x.label).join(', ') + (arr.length > max ? ` and ${arr.length - max} more` : '');
    s.push({ view: 'overview', title: `${G.meta.repo} at a glance`, body: `${n('app').length} apps and services, ${n('data').length} data stores, ${n('cloud').length} cloud resources and ${n('external').length} external services${G.findings.length ? ` — ${G.findings.length} open risks` : ''}.` });
    const lines = {
      client: (a) => `Who uses it: ${names(a)}.`,
      app: (a) => `What we build: ${a.slice(0, 6).map((x) => `${x.label} (${x.tech || 'package'})`).join(', ')}.`,
      data: (a) => `Where data lives: ${names(a)}.`,
      cloud: (a) => `Where it runs: ${names(a, 8)}.`,
      external: (a) => `Services we depend on: ${names(a, 8)}. ${a.filter((x) => x.cost && x.cost.tier !== 'free').length} of them are paid.`,
      cicd: (a) => `How it ships: ${names(a)}.`,
    };
    L.lanes.forEach((k, i) => s.push({ view: 'overview', lane: i, title: LAYER_NAME[k], body: (lines[k] || ((a) => names(a)))(L.cols[i]) }));
    if (G.nodes.some((x) => x.kind === 'module')) s.push({ view: 'code', title: 'Inside the code', body: `${n('module').length} feature modules, and the data and services each one touches.` });
    s.push({ view: 'infra', title: 'Infrastructure', body: 'How each app is built, deployed and hosted, and what protects the data.' });
    if (G.findings.length) s.push({ view: 'risks', title: `${G.findings.length} open risks`, body: G.findings.slice(0, 3).map((f) => `${f.severity}: ${f.title}`).join(' · ') });
    if (DIFF) s.push({ view: 'changes', title: 'What changed', body: `${DIFF.added.length} added, ${DIFF.changed.length} changed, ${DIFF.removed.length} removed, ${DIFF.newFindings.length} new risks.` });
    return s;
  }
  function showStep(i) {
    stepIdx = Math.max(0, Math.min(steps.length - 1, i));
    const st = steps[stepIdx];
    if (state.view !== st.view) {
      state.view = st.view;
      state.selected = null;
      renderTabs();
      render();
    }
    const L = state.L;
    if (st.lane != null) {
      const x = st.lane * (LANE_W + LANE_GAP);
      zoomTo({ x: x - 90, y: -10, w: LANE_W + 180, h: L.laneH + 20 }, 0.55);
      document.querySelectorAll('.card').forEach((c) => c.classList.toggle('dim', L.place.get(c.dataset.id)?.col !== st.lane));
      document.querySelectorAll('.edge').forEach((g) => {
        const on = L.place.get(g.dataset.from)?.col === st.lane || L.place.get(g.dataset.to)?.col === st.lane;
        g.classList.toggle('dim', !on);
        g.classList.toggle('hot', on);
      });
    } else {
      applyHighlight();
      setTimeout(fit, 30);
    }
    $('#caption').innerHTML = `<div class="step">${stepIdx + 1} / ${steps.length}</div><div class="title">${esc(st.title)}</div><div class="body">${esc(st.body)}</div><div class="nav">← → or click to move · Esc to exit</div>`;
  }
  function startPresent() {
    steps = buildSteps();
    document.body.classList.add('presenting');
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    setTimeout(() => showStep(0), 80);
  }
  function stopPresent() {
    document.body.classList.remove('presenting');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    setView(state.view);
  }
  $('#presentBtn').onclick = startPresent;

  document.addEventListener('keydown', (ev) => {
    if (ev.target.tagName === 'INPUT') return;
    if (document.body.classList.contains('presenting')) {
      if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(ev.key)) { ev.preventDefault(); showStep(stepIdx + 1); }
      if (['ArrowLeft', 'PageUp', 'Backspace'].includes(ev.key)) { ev.preventDefault(); showStep(stepIdx - 1); }
      if (ev.key === 'Escape') stopPresent();
      return;
    }
    if (ev.key === '/') { ev.preventDefault(); $('#q').focus(); }
    if (ev.key === 'f' || ev.key === 'F') fit();
    if (ev.key === 'p' || ev.key === 'P') startPresent();
    if (ev.key === 't' || ev.key === 'T') $('#themeBtn').click();
    if (ev.key === 's' || ev.key === 'S') setStyle(!document.body.classList.contains('sketch'));
    if (ev.key === 'Escape') select(null);
    const keys = Object.keys(VIEWS);
    if (/^[1-9]$/.test(ev.key) && keys[+ev.key - 1]) setView(keys[+ev.key - 1]);
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && document.body.classList.contains('presenting')) stopPresent();
  });
  window.addEventListener('hashchange', () => {
    const k = (location.hash || '').slice(1);
    if (VIEWS[k] && k !== state.view) setView(k);
  });
  window.addEventListener('resize', () => { if (!document.body.classList.contains('presenting')) fit(); });

  // ---------- Sketch / Clean (PRD v2, R3) ----------
  function setStyle(sketch) {
    document.body.classList.toggle('sketch', sketch);
    document.querySelectorAll('#styleSeg button').forEach((b) => b.classList.toggle('on', (b.dataset.s === 'sketch') === sketch));
    try { localStorage.setItem('repomind-style', sketch ? 'sketch' : 'clean'); } catch (e) {}
    if (state.L) render();
  }
  document.querySelectorAll('#styleSeg button').forEach((b) => (b.onclick = () => setStyle(b.dataset.s === 'sketch')));
  let savedStyle = null;
  try { savedStyle = localStorage.getItem('repomind-style'); } catch (e) {}
  setStyle(savedStyle ? savedStyle === 'sketch' : typeof rough !== 'undefined');
  // Theme changes the ink colour baked into rough.js strokes, so redraw.
  new MutationObserver(() => state.L && render()).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  // Hand fonts change text widths; redraw once they arrive.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => state.L && render());

  // ---------- Boot ----------
  function header() {
    $('#repoName').textContent = G.meta.repo;
    $('#repoSub').textContent = `RepoMind map${G.meta.commit ? ' · ' + G.meta.commit : ''} · ${G.nodes.filter((n) => n.kind !== 'module').length} components · ${G.edges.length} links`;
  }
  header();
  markers();
  const initial = (location.hash || '').slice(1);
  // Live pages always have a previous version to diff against, so open on Overview unless a compare was asked for.
  setView(VIEWS[initial] ? initial : DIFF && (!LIVE || LIVE.base) ? 'changes' : 'overview');

  // ---------- Live mode (served by `repomind serve`, PRD v2) ----------
  if (LIVE) {
    document.body.classList.add('live');
    const api = (p, opts) => fetch(p, opts).then(async (r) => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.statusText);
      return j;
    });
    const repoPath = `${encodeURIComponent(LIVE.owner)}/${encodeURIComponent(LIVE.repo)}`;
    const live = { versions: [], sha: G.meta.commit, base: null, pinned: !!LIVE.pinned, info: LIVE.info || {} };
    const ago = (t) => {
      const s = Math.max(0, (Date.now() - new Date(t).getTime()) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return `${Math.round(s / 60)} min ago`;
      if (s < 86400) return `${Math.round(s / 3600)} h ago`;
      return `${Math.round(s / 86400)} days ago`;
    };
    const shortDate = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

    function badge() {
      const on = !!live.info.connected;
      const latest = live.versions[0];
      $('#liveBadge').classList.toggle('on', on);
      $('#liveText').textContent = on ? `Live · ${live.info.branch || ''} · updated ${latest ? ago(latest.scannedAt) : ''}` : `Snapshot${latest ? ' · ' + ago(latest.scannedAt) : ''}`;
    }

    function timeline() {
      const T = $('#timeline');
      const vs = [...live.versions].reverse();
      const changed = vs.filter((v) => v.changes > 0).length;
      T.innerHTML = `<div class="tl-head"><span class="tl-title">Versions</span><span class="tl-sub">${vs.length} commit${vs.length === 1 ? '' : 's'} · big dots changed the map · shift-click a second dot to compare</span>${live.base ? '<button class="back tl-clear" id="tlClear">Clear compare</button>' : ''}</div><div class="tl-track" id="tlTrack"></div>`;
      const track = $('#tlTrack');
      vs.forEach((v, i) => {
        const b = document.createElement('button');
        const big = v.changes > 0 || i === 0;
        const color = v.newRisks > 0 ? 'var(--f-risk)' : v.removed > 0 && !v.added ? 'var(--f-risk)' : v.changed > 0 && !v.added ? 'var(--f-external)' : 'var(--f-data)';
        b.className = `tl-v${big ? ' big' : ''}${v.sha === live.sha ? ' cur' : ''}${v.sha === live.base ? ' base' : ''}`;
        b.title = `${v.sha} · ${v.message || ''}${v.author ? ' · ' + v.author : ''}\n${v.changes ? `${v.added} added, ${v.removed} removed, ${v.changed} changed, ${v.newRisks} new risks` : 'no map change'}`;
        b.setAttribute('aria-label', `Version ${v.sha}, ${shortDate(v.committedAt || v.scannedAt)}`);
        b.innerHTML = `<span class="dot" style="${big && v.sha !== live.sha && i > 0 ? `background:${color}` : ''}"></span><span class="sha">${esc(v.sha)}</span><span class="when">${i === vs.length - 1 ? 'latest' : esc(shortDate(v.committedAt || v.scannedAt))}</span>`;
        b.onclick = (ev) => {
          if (ev.shiftKey && v.sha !== live.sha) return load(live.sha, v.sha, true);
          load(v.sha, null, true);
        };
        track.appendChild(b);
      });
      track.scrollLeft = track.scrollWidth;
      const c = $('#tlClear');
      if (c) c.onclick = () => load(live.sha, null, true);
    }

    async function refreshVersions() {
      const r = await api(`/api/repos/${repoPath}/versions`);
      const prevTop = live.versions[0]?.sha;
      live.versions = r.versions;
      live.info = r.repo;
      badge();
      timeline();
      return prevTop;
    }

    // Swap the graph in place: keeps zoom, selection and view (PRD v2, R5).
    async function load(sha, base, explicit) {
      const q = new URLSearchParams();
      if (sha) q.set('sha', sha);
      if (base) q.set('base', base);
      const d = await api(`/api/repos/${repoPath}/graph?${q}`);
      const keepSel = state.selected, keepView = state.view, keepXf = { ...view };
      setData(d);
      live.sha = d.graph.meta.commit;
      live.base = base || null;
      if (explicit) live.pinned = live.versions[0]?.sha !== live.sha || !!base;
      header();
      renderTabs();
      state.view = VIEWS[keepView] ? keepView : 'overview';
      if (base && VIEWS.changes) state.view = 'changes';
      render();
      Object.assign(view, keepXf);
      applyView(false);
      if (keepSel && allNodes.has(keepSel)) select(keepSel);
      else panelSummary();
      renderTabs();
      timeline();
      const u = new URL(location.href);
      live.pinned ? u.searchParams.set('sha', live.sha) : u.searchParams.delete('sha');
      base ? u.searchParams.set('base', base) : u.searchParams.delete('base');
      try { history.replaceState(null, '', u.pathname + u.search + '#' + state.view); } catch (e) {}
      if (explicit && state.view !== keepView) requestAnimationFrame(fit);
    }

    let toastTimer = null;
    function toast(html) {
      const t = $('#toast');
      t.innerHTML = `<span class="pulse"></span><span>${html}</span>`;
      t.classList.add('show');
      const a = t.querySelector('[data-changes]');
      if (a) a.onclick = () => { setView('changes'); t.classList.remove('show'); };
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 9000);
    }

    async function poll() {
      try {
        const prevTop = await refreshVersions();
        const top = live.versions[0];
        if (top && prevTop && top.sha !== prevTop) {
          const parts = [];
          if (top.added) parts.push(`+${top.added} added`);
          if (top.removed) parts.push(`−${top.removed} removed`);
          if (top.newRisks) parts.push(`${top.newRisks} new risk${top.newRisks > 1 ? 's' : ''}`);
          if (!live.pinned) await load(top.sha, null, false);
          toast(`<b>New commit ${esc(top.sha)}</b> — ${parts.length ? 'map updated: ' + esc(parts.join(', ')) : 'no map change'}${top.changes && !live.pinned ? ' · <a data-changes>See changes</a>' : ''}`);
        }
      } catch (e) {}
    }
    setInterval(poll, (LIVE.pollSeconds || 30) * 1000);
    setInterval(badge, 30000);

    $('#refreshBtn').onclick = async () => {
      $('#refreshBtn').disabled = true;
      try {
        const r = await api(`/api/repos/${repoPath}/refresh`, { method: 'POST' });
        if (r.job) await waitJob(r.job);
        await poll();
        if (!r.job) toast('Up to date — no new commit on ' + esc(live.info.branch || 'the branch'));
      } catch (e) { toast(esc(e.message)); }
      $('#refreshBtn').disabled = false;
    };
    async function waitJob(id) {
      for (let i = 0; i < 240; i++) {
        const j = await api(`/api/jobs/${id}`);
        if (j.status !== 'running') return j;
        await new Promise((r) => setTimeout(r, 1000));
      }
    }

    // ---------- Share & download dialog (design: Share) ----------
    const modal = $('#modal');
    const closeModal = () => modal.classList.remove('open');
    modal.addEventListener('click', (ev) => { if (ev.target === modal) closeModal(); });
    document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
    const copy = (text, btn) => {
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
        () => { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => (btn.textContent = o), 1400); },
        () => {},
      );
    };
    function openShare(secret) {
      const origin = location.origin;
      const link = `${origin}/r/${repoPath}`;
      const on = !!live.info.connected;
      const fields = [
        ['Payload URL', `${origin}/api/webhook/github`],
        ['Content type', 'application/json · events: push'],
        ['Secret', secret || (on ? '•••••••• (shown once when you connected)' : 'generated when you connect')],
      ];
      $('#modalBox').innerHTML = `
        <div class="mhead"><h1 id="share-title">Take it with you</h1><span class="mono muted">${esc(G.meta.repo)} @ ${esc(live.sha || '')}</span><button class="btn close" id="mClose" aria-label="Close">×</button></div>
        <div class="cols">
          <div class="col">
            <h2>Download</h2>
            <div class="formats">
              <button class="fmt" data-f="png" style="background-image:repeating-linear-gradient(-41deg,var(--f-client) 0 2px,transparent 2px 9px)"><b>PNG</b><span>for slides · 2× sharp</span></button>
              <button class="fmt" data-f="svg" style="background-image:repeating-linear-gradient(-41deg,var(--f-app) 0 2px,transparent 2px 9px)"><b>SVG</b><span>scales to any size</span></button>
              <button class="fmt" data-f="html" style="background-image:repeating-linear-gradient(-41deg,var(--f-data) 0 2px,transparent 2px 9px)"><b>HTML map</b><span>interactive, works offline</span></button>
              <button class="fmt" data-f="json" style="background-image:repeating-linear-gradient(-41deg,var(--f-external) 0 2px,transparent 2px 9px)"><b>Graph JSON</b><span>for scripts and CI</span></button>
            </div>
            <span class="hint">PNG and SVG export the current view (${esc(VIEWS[state.view].name)}).</span>
            <h2>Share a link</h2>
            <div class="field"><input readonly id="shareLink" value="${esc(link)}" aria-label="Share link"><button class="btn primary" id="copyLink">Copy link</button></div>
            <span class="hint">Always opens the latest version. Add <span class="mono">?sha=${esc(live.sha || '')}</span> to pin this one.</span>
          </div>
          <div class="col live-box">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Keep it live</h2><span class="pill ${on ? '' : 'off'}"><span class="pulse" style="width:8px;height:8px;border-radius:50%;background:currentColor"></span>${on ? `Polling every ${Math.round((live.info.pollMinutes || 5))} min` : 'Not connected'}</span></div>
            <p style="margin:0">For instant updates on every push, add this webhook in GitHub → Settings → Webhooks.</p>
            ${fields.map(([k, v], i) => `<div><label class="k">${k}</label><div class="field"><code>${esc(v)}</code><button class="btn" data-copy="${i}">Copy</button></div></div>`).join('')}
            ${on ? '' : `<label style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="backfill" checked style="width:20px;height:20px;accent-color:#6965DB">Scan the last 10 commits for history</label><button class="btn primary" id="doConnect" style="align-self:flex-start">Connect for live updates</button>`}
          </div>
        </div>`;
      modal.classList.add('open');
      $('#mClose').onclick = closeModal;
      $('#copyLink').onclick = (ev) => copy(link, ev.target);
      document.querySelectorAll('#modalBox [data-copy]').forEach((b) => (b.onclick = () => copy(fields[+b.dataset.copy][1], b)));
      document.querySelectorAll('#modalBox .fmt').forEach((b) => (b.onclick = () => {
        const f = b.dataset.f;
        if (f === 'html') location.href = `/r/${repoPath}/download.html?sha=${encodeURIComponent(live.sha)}`;
        else exportAs(f);
      }));
      const c = $('#doConnect');
      if (c) c.onclick = async () => {
        c.disabled = true;
        try {
          const r = await api(`/api/repos/${repoPath}/connect`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ backfill: $('#backfill').checked }) });
          live.info = r.repo;
          badge();
          openShare(r.secret);
          toast('Connected — backfilling history; new dots will appear on the timeline.');
          setTimeout(poll, 4000);
        } catch (e) { toast(esc(e.message)); c.disabled = false; }
      };
    }
    $('#downloadBtn').onclick = () => openShare();

    refreshVersions().then(() => {
      if (LIVE.base) load(live.sha, LIVE.base, true);
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
