<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · RepoMind</title>
<link rel="icon" type="image/svg+xml" href="/*__FAVICON__*/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>/*__THEME_CSS__*/</style>
<!-- Flow 0 · Sign in, from the v2 design artifact (D29). Accounts are not built yet (PRD v2 non-goal):
     this server is single-tenant, so "Continue with GitHub" opens the workspace using the server's GitHub token. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; }
  .left { display: flex; flex-direction: column; padding: 28px 56px; }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 700; font-size: 17px; letter-spacing: -.025em; }
  .brand img { width: 26px; height: 26px; }
  .form { margin: auto; width: 100%; max-width: 380px; }
  h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.035em; }
  .lead { margin: 10px 0 32px; font-size: 16px; color: var(--pencil); }
  button { width: 100%; height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 10px; font: 600 15px var(--ui); cursor: pointer; }
  .gh { border: 0; background: #262626; color: #fff; }
  :root.dark .gh { background: #E2E8F0; color: #0F172A; }
  .sso { margin-top: 10px; border: 1px solid var(--line-soft); background: var(--card); color: var(--ink); }
  .or { display: flex; align-items: center; gap: 12px; margin: 26px 0; font-size: 12.5px; color: var(--muted); }
  .or span { flex: 1; height: 1px; background: var(--line-soft); }
  label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 8px; }
  input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--card); color: var(--ink); font: 500 15px var(--ui); outline: 0; }
  input:focus { border-color: #4F46E5; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
  .primary { margin-top: 12px; border: 0; background: #4F46E5; color: #fff; }
  .msg { min-height: 20px; margin-top: 14px; font-size: 13.5px; color: var(--pencil); text-align: center; }
  .msg.err { color: #E03131; }
  .new { margin: 18px 0 0; font-size: 14px; color: var(--pencil); text-align: center; }
  .new a { font-weight: 600; }
  .fine { margin: 0; font-size: 12.5px; color: var(--muted); }
  .fine a { color: inherit; text-decoration: underline; }
  .right { position: relative; margin: 12px; border-radius: 22px; overflow: hidden; background: #1E1B4B; display: flex; flex-direction: column; justify-content: space-between; padding: 48px; }
  .right .bg { position: absolute; inset: 0; background: radial-gradient(70% 55% at 80% 10%, rgba(99,102,241,.55), transparent 70%), radial-gradient(50% 45% at 10% 100%, rgba(255,107,107,.28), transparent 70%); }
  .pill { position: relative; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; font-size: 13px; color: #C7D2FE; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: #34D399; }
  .shot { position: relative; height: 54%; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 40px 80px -30px rgba(0,0,0,.7); transform: translateX(14%); }
  .shot iframe { width: 160%; height: 160%; border: 0; transform: scale(.625); transform-origin: 0 0; pointer-events: none; }
  .quote { position: relative; margin: 0; font-size: 28px; line-height: 1.2; font-weight: 650; letter-spacing: -.03em; color: #fff; max-width: 560px; }
  .quote span { color: #A5B4FC; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } .right { display: none; } .left { padding: 24px; } }
</style>
</head>
<body>
<section class="left">
  <a class="brand" href="/"><img class="logo" src="/*__MARK__*/" data-light="/*__MARK__*/" data-dark="/*__MARK_DARK__*/" alt="" />RepoMind</a>
  <div class="form">
    <h1>Sign in</h1>
    <p class="lead">Pick up where your team left off.</p>
    <button type="button" class="gh" id="ghBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7"/><path d="M18 10.5c0 4-6 3-11 5.5"/></svg>
      Continue with GitHub
    </button>
    <button type="button" class="sso" id="ssoBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Continue with SSO
    </button>
    <div class="or"><span></span>or with email<span></span></div>
    <form id="emailForm">
      <label for="email">Work email</label>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="email" required>
      <button type="submit" class="primary">Email me a sign-in link</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <p class="new">New to RepoMind? <a href="/">Map your first repo</a></p>
  </div>
  <p class="fine">Read-only access. Your code never leaves your server.</p>
</section>

<section class="right" aria-hidden="true">
  <div class="bg"></div>
  <div class="pill" id="pill"><i></i>Your maps, updated on every commit</div>
  <div class="shot"><iframe src="/example" title="" tabindex="-1" loading="lazy"></iframe></div>
  <p class="quote">One map. Every commit.<br><span>The whole team on the same picture.</span></p>
</section>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const msg = (t, err) => { $('#msg').textContent = t; $('#msg').className = 'msg' + (err ? ' err' : ''); };
  // Single-tenant server: GitHub access is the server's own token, so continue straight to the workspace.
  $('#ghBtn').onclick = () => (location.href = '/app');
  $('#ssoBtn').onclick = () => msg('SSO needs team accounts, which come in a later version. Use “Continue with GitHub” for now.');
  $('#emailForm').onsubmit = (e) => { e.preventDefault(); msg('Email sign-in links come with team accounts in a later version. Use “Continue with GitHub” for now.'); };
  fetch('/api/repos').then((r) => r.json()).then((d) => {
    const top = d.repos && d.repos[0];
    if (top) $('#pill').replaceChildren(document.createElement('i'), `${top.owner}/${top.repo} · ${top.connected ? 'live' : 'snapshot'}`);
  }).catch(() => {});
  let saved = null;
  try { saved = localStorage.getItem('repomind-theme'); } catch (e) {}
  document.documentElement.classList.toggle('dark', saved ? saved === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
  document.querySelectorAll('img.logo').forEach((i) => (i.src = i.dataset[document.documentElement.classList.contains('dark') ? 'dark' : 'light']));
})();
</script>
</body>
</html>
