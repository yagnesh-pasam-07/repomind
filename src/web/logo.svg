<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64">
  <!-- RepoMind weaverbird (D26): indigo outline, honey breast, a woven wing, and a thread
       from its beak tying three nodes together — a tiny dependency graph. -->
  <style>
    .ink { stroke: #4F46E5; }
    .dot { fill: #FBFAF7; stroke: #4F46E5; }
    .eye { fill: #262626; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #A5B4FC; }
      .dot { fill: #0F172A; stroke: #A5B4FC; }
      .eye { fill: #E2E8F0; }
    }
  </style>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body + head, slightly wobbly like a pen line. -->
    <path class="ink" fill="#FDE68A" stroke-width="2.4" d="M10.5 41.5 C10.9 31.6 17.2 24.9 25.6 23.2 C26.8 17.4 31.3 13.6 36.8 13.9 C42.2 14.2 45.6 18.1 45.9 22.8 L53.6 24.6 L46.2 27.8 C46.3 36.9 40.6 45.4 30.1 47.6 C23.4 49 16.9 47.8 10.5 41.5 Z" />
    <!-- Honey breast. -->
    <path fill="#FBBF24" d="M25.4 31.4 C29.6 29.8 34.6 31.6 36.6 35.8 C37.8 38.6 36.6 42.3 33.4 44.6 C29.4 46.4 24.4 46.6 20.4 45.2 C18.9 40.2 21 33.2 25.4 31.4 Z" />
    <!-- Woven wing: outline + cross-hatching. -->
    <path class="ink" fill="#C7D2FE" stroke-width="2" d="M14.2 35.6 C18.2 29.6 25.1 27.1 30.7 28.6 C27.6 34.3 22.4 39.1 14.9 41.6 C13.6 39.8 13.4 37.6 14.2 35.6 Z" />
    <path class="ink" stroke-width="1.1" d="M17.4 32.1 L24.8 39.2 M20.9 30.1 L27.9 36.4 M24.6 28.9 L29.7 33.6 M15.4 36.1 L20.6 31.4 M17.6 39.4 L25.4 31.2 M21.4 39.9 L29.2 30.6" />
    <!-- Tail. -->
    <path class="ink" stroke-width="2.2" d="M11.6 42.6 L3.4 49.4 M12.8 44.6 L5.9 53.4" />
    <!-- Eye. -->
    <circle class="eye" cx="39.4" cy="20.6" r="1.9" />
    <!-- Thread from the beak weaving through three nodes. -->
    <path class="ink" stroke-width="1.6" stroke-dasharray="0" d="M53.6 24.6 C59.6 22.1 63.1 15.4 70.4 14.6 C76.8 13.9 80.6 18.7 79.9 24.6 C79.2 30.4 72.1 32.4 69.6 37.6 C67.4 42.3 71.8 48.2 78.6 47.4 C84.1 46.8 88.4 42.6 90.6 38.6" />
    <circle class="dot" cx="70.4" cy="14.6" r="4.2" stroke-width="2" />
    <circle class="dot" cx="69.8" cy="37.4" r="4.2" stroke-width="2" />
    <circle class="dot" cx="88.6" cy="40.6" r="4.2" stroke-width="2" />
  </g>
</svg>
