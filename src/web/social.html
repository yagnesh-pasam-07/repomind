<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<title>RepoMind social preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" />
<!-- 1280×640 GitHub social preview (D31). Rendered once to docs/social-preview.png. -->
<style>
  html, body { margin: 0; }
  .card { width: 1280px; height: 640px; box-sizing: border-box; padding: 84px 96px; display: flex; flex-direction: column; justify-content: space-between; background: #F4F1EA; color: #262626; font-family: Inter, sans-serif; position: relative; overflow: hidden; }
  .glow { position: absolute; right: -120px; top: -120px; width: 620px; height: 620px; background: radial-gradient(closest-side, rgba(99,102,241,.28), transparent); }
  .brand { display: flex; align-items: center; gap: 18px; font-weight: 700; font-size: 40px; letter-spacing: -.03em; position: relative; }
  .brand img { width: 64px; height: 64px; }
  h1 { margin: 0; font-weight: 800; font-size: 92px; line-height: 1.0; letter-spacing: -.05em; position: relative; }
  h1 span { color: #4F46E5; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #6B6862; position: relative; }
  .foot code { font: 500 22px 'IBM Plex Mono', monospace; color: #262626; background: #fff; border: 1px solid #E4DED2; padding: 8px 14px; border-radius: 10px; }
</style></head>
<body><div class="card">
  <div class="glow"></div>
  <div class="brand"><img src="/*__MARK__*/" alt="" />RepoMind</div>
  <h1>Your codebase,<br><span>as a living map.</span></h1>
  <div class="foot"><span>Apps · data · cloud · integrations · risks — redrawn on every commit</span><code>npx repomind map .</code></div>
</div></body></html>
